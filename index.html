<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#5e358c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Seizure timer">
  <title>Seizure timer</title>
  <link rel="manifest" href="manifest.json?v=3">
  <link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main>
    <section id="idle">
      <button class="start" id="startBtn"><span class="start-label">Start<br>Timer</span></button>
      <button class="btn-subtle" id="testBtn">Test sound &amp; voice</button>
    </section>

    <section id="running" hidden>
      <div class="clock" id="clock" aria-live="off"><span id="clockMin">0</span><span class="colon">:</span><span id="clockSec">00</span></div>
      <dl class="facts">
        <dt>Started</dt><dd id="startedAt"></dd>
        <dt>Location</dt><dd id="locLine"></dd>
        <dt>Status</dt><dd id="sysLine"></dd>
      </dl>
      <div class="banner info" id="banner" hidden role="alert"></div>
      <div class="track" aria-hidden="true">
        <div class="fill" id="fill"></div>
        <div class="tick" style="left:15%"><span class="up">45s</span></div>
        <div class="tick" style="left:20%"><span>1m</span></div>
        <div class="tick" style="left:40%"><span>2m</span></div>
        <div class="tick" style="left:60%"><span>3m</span></div>
        <div class="tick" style="left:80%"><span>4m</span></div>
        <div class="tick" style="left:95%"><span class="up">4:45</span></div>
        <div class="tick" style="left:100%"><span>5m</span></div>
      </div>
      <ul class="events" id="events"></ul>
      <div class="row">
        <button class="btn stop" id="stopBtn">Seizure ended</button>
      </div>
    </section>

    <section id="history">
      <div class="history-head">
        <h2>Past events <span class="count" id="eventCount" hidden></span></h2>
        <div class="history-actions" id="historyActions" hidden>
          <button class="btn" id="copyBtn">Copy log</button>
          <button class="btn" id="clearBtn">Clear history</button>
        </div>
      </div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div id="list"></div>
    </section>
  </main>

  <script src="script.js?v=3"></script>
</body>
</html>
